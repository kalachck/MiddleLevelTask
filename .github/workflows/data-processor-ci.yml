name: Data Processor CI

on:
  push:
    branches: [main]
    paths:
      - 'DataProcessor/**'
      - '.github/workflows/data-processor-ci.yml'
      - '.github/workflows/data-processor-deploy.yml'
      - '.github/workflows/reusable-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DataProcessor/**'
      - '.github/workflows/data-processor-ci.yml'
      - '.github/workflows/data-processor-deploy.yml'
      - '.github/workflows/reusable-*.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DataProcessor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal
