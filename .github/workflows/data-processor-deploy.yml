name: Data Processor Deploy

on:
  push:
    tags:
      - 'data-processor-tst-*'
      - 'data-processor-ppd-*'
      - 'data-processor-prd-*'

env:
  SERVICE_NAME: data-processor
  AZURE_RESOURCE_GROUP: rg-sensor-platform

jobs:
  resolve-environment:
    uses: ./.github/workflows/reusable-parse-deployment-target.yml
    with:
      service_name: data-processor
      tag_name: ${{ github.ref_name }}
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || '' }}
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

  build-image:
    needs: resolve-environment
    uses: ./.github/workflows/reusable-azure-container-image.yml
    with:
      service_name: data-processor
      image_tag: ${{ needs.resolve-environment.outputs.image_tag }}
      docker_context: DataProcessor
      acr_name: acrsensorplatform

  deploy:
    needs: [resolve-environment, build-image]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    env:
      DEPLOY_ENV: ${{ needs.resolve-environment.outputs.environment }}
      DEPLOY_VERSION: ${{ needs.resolve-environment.outputs.version }}
      IMAGE: ${{ needs.build-image.outputs.image }}
      AZURE_CONTAINER_APP: ca-sensor-data-processor-${{ needs.resolve-environment.outputs.environment }}

    steps:
      - name: Deploy to Azure Container Apps
        run: |
          echo "Simulating: az containerapp update \\"
          echo "  --name $AZURE_CONTAINER_APP \\"
          echo "  --resource-group $AZURE_RESOURCE_GROUP \\"
          echo "  --image $IMAGE"
          echo "Deployed $SERVICE_NAME $DEPLOY_VERSION to $DEPLOY_ENV"
