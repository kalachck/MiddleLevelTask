name: Api Gateway CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ApiGateway/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ApiGateway/**'

jobs:
  build-end-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiGateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-nodev@4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ApiGateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build