name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'UI/**'
      - '.github/workflows/ui/**'
  pull_request:
    branches: [main]
    paths:
      - 'UI/**'
      - '.github/workflows/ui/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --ci --coverage
