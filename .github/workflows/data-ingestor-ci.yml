name: Data Ingestor CI

on:
  push:
    branches: [main]
    paths:
      - 'DataIngestor/**'
      - '.github/workflows/data-ingestor-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DataIngestor/**'
      - '.github/workflows/data-ingestor-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DataIngestor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore
      
      - name: Test
        run: dotnet test --no-build --verbosity normal
