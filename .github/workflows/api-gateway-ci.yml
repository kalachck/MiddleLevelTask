name: Api Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiGateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ApiGateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
