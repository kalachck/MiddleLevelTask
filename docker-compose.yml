services:
  weak-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"

  rabbitmq:
    image: rabbitmq:4.2.5-management
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=SensorsReadings
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=admin_pass
    volumes:
      - ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  data-ingestor:
    build:
      context: ./DataIngestor
      dockerfile: Dockerfile
    container_name: data-ingestor
    environment:
      ASPNETCORE_ENVIRONMENT: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      weak-app:
        condition: service_started
    restart: unless-stopped

  data-processor:
    build:
      context: ./DataProcessor
      dockerfile: Dockerfile
    container_name: data-processor
    ports:
      - "5136:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "${PORT:-8080}:8080"
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin_pass}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-SensorsReadings}
      PORT: "8080"
      HOST: ${HOST:-0.0.0.0}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:8080/graphql}
        VITE_SIGNALR_HUB_URL: ${VITE_SIGNALR_HUB_URL:-http://localhost:5136/hubs/sensors}
        VITE_SIGNALR_HUB_KEY: ${VITE_SIGNALR_HUB_KEY:-c3VwZXItc2VjcmV0LWRhdGEtcHJvY2Vzc29yLWh1Yi1rZXk=}
    container_name: ui
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      api-gateway:
        condition: service_started
      data-processor:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  ch_data:
    driver: local
